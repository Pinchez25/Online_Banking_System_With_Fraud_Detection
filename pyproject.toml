[project]
name = "bank-system"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "celery[redis]>=5.7.0",
    "channels>=4.3.2,<5",
    "channels-redis>=4.2,<5",
    "confluent-kafka>=2.10",
    "django>=6.1.3",
    "django-unfold>=0.110.1",
    "fpdf2>=2.8",
    "gunicorn>=27.0.1",
    "pandas>=3.1.1",
    "pillow>=13.0",
    "psycopg[binary]>=3.3.9",
    "pyarrow>=20",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "scikit-learn>=1.9.1",
    "user-agents>=2.2.0",
    "uvicorn-worker>=0.4.0",
    "uvicorn[standard]>=0.55.0",
    "whitenoise>=6.12.0",
]

[project.scripts]
bank_manage = "Online_Banking_System.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["Online_Banking_System", "accounts", "bank", "events", "fraud", "institution", "loans"]

[dependency-groups]
dev = [
    "altair>=6.3.0",
    "celery-types>=0.26.0",
    "factory-boy>=3.3.3",
    "fakeredis>=2.41.0",
    "honcho>=2.0.0",
    "marimo>=0.26.0",
    "pre-commit>=4.7.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 130
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PLC0415"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "Online_Banking_System.test_settings"
testpaths = ["tests"]
addopts = ["--strict-markers", "--no-migrations", "--cov", "--cov-report=term-missing:skip-covered"]
markers = [
    "unit: pure logic, no database",
    "integration: services, views and admin against the database",
    "e2e: browser journeys against a live server (needs `playwright install chromium`)",
]
filterwarnings = [
    "error::RuntimeWarning",
    "ignore:Overriding get_action_choices\\(\\) without the 'action_location'::unfold",
    "ignore:Session-scoped fixtures defined as instance methods are deprecated",
]

[tool.coverage.run]
branch = true
source = ["accounts", "bank", "events", "fraud", "institution", "loans", "Online_Banking_System"]
omit = ["*/migrations/*", "Online_Banking_System/asgi.py", "Online_Banking_System/wsgi.py",
        "Online_Banking_System/test_settings.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:"]
