[project]
name = "bank-system"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "celery[redis]>=5.7.0",
    "channels-redis>=4.2,<5",
    "channels[daphne]>=4.3.2,<5",
    "confluent-kafka>=2.10",
    "django>=6.1.3",
    "django-unfold>=0.110.1",
    "fpdf2>=2.8",
    "pandas>=3.1.1",
    "pillow>=13.0",
    "psycopg[binary]>=3.3.9",
    "pyarrow>=20",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "scikit-learn>=1.9.1",
    "user-agents>=2.2.0",
]

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "fakeredis>=2.41.0",
    "honcho>=2.0.0",
    "model-bakery>=1.25.0",
    "pre-commit>=4.7.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 130
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PLC0415"]
