<section class="panel" aria-label="Recent transactions">
    <div class="panel__head">
        <div>
            <h2>Recent transactions</h2>
            <p class="panel__subtitle">Your latest activity, sent and received</p>
        </div>
        <div class="panel__tools">
            <a class="btn btn--ghost" href="{% url 'bank:transactions' %}">View all &amp; export</a>
        </div>
    </div>

    <div class="table-wrap">
        <table class="table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Description</th>
                    <th>Reference</th>
                    <th>Type</th>
                    <th class="table__num">Amount (KES)</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                {% include "partials/transaction_rows.html" with rows=transactions %}
            </tbody>
        </table>
    </div>
</section>
