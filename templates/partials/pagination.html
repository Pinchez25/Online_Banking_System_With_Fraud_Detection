{% if page_obj.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Pagination">
    {% if page_obj.has_previous %}
        <a class="btn btn--ghost" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">Previous</a>
    {% endif %}
    <span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }} · {{ page_obj.paginator.count }} result{{ page_obj.paginator.count|pluralize }}</span>
    {% if page_obj.has_next %}
        <a class="btn btn--ghost" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Next</a>
    {% endif %}
</nav>
{% endif %}
